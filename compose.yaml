services:
  runtime-init:
    build:
      context: .
      target: sandbox-runner
    user: "0:0"
    network_mode: none
    read_only: true
    command: ["sh","-lc","mkdir -p /runtime && chown -R 1000:1000 /runtime && chmod -R go-rwx /runtime && chmod 0700 /runtime"]
    volumes:
      - debug_ai_runtime:/runtime:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"

  sandbox-init:
    build:
      context: .
      target: sandbox-runner
    user: "0:0"
    network_mode: none
    read_only: true
    command: ["sh","-lc","mkdir -p /sandbox-jobs/jobs && chown -R 1000:1000 /sandbox-jobs && chmod 0750 /sandbox-jobs /sandbox-jobs/jobs"]
    volumes:
      - debug_ai_sandbox_jobs:/sandbox-jobs:rw
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"

  debug-ai:
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      sandbox-init:
        condition: service_completed_successfully
    build:
      context: .
      target: debug-ai
    restart: unless-stopped
    network_mode: host
    environment:
      DEBUG_AI_CORE_URL: ${DEBUG_AI_CORE_URL:?required}
      AI_CORE_API_KEY: ${AI_CORE_API_KEY:?required}
      DEBUG_AI_EVIDENCE_SEARCH_URL: ${DEBUG_AI_EVIDENCE_SEARCH_URL:?required}
      DEBUG_AI_EVIDENCE_SEARCH_SECRET_FILE: /run/secrets/astera_internal_service_secret
      DEBUG_AI_EVIDENCE_SEARCH_CALLER_ID: ${DEBUG_AI_EVIDENCE_SEARCH_CALLER_ID:-debug-ai}
      DEBUG_AI_TGSERVER_URL: ${DEBUG_AI_TGSERVER_URL:?required}
      DEBUG_AI_TGSERVER_LOG_PROJECT_ID: ${DEBUG_AI_TGSERVER_LOG_PROJECT_ID:?required}
      DEBUG_AI_TGSERVER_KB_PROJECT_ID: ${DEBUG_AI_TGSERVER_KB_PROJECT_ID:?required}
      DEBUG_AI_REPO_ALLOWLIST: ${DEBUG_AI_REPO_ALLOWLIST:?required}
      DEBUG_AI_OSV_DB: /opt/osv-db
      DEBUG_AI_OSV_SCANNER: /opt/debugai-tools/osv-scanner
      DEBUG_AI_RUNTIME_ROOT: /app/runtime
      DEBUG_AI_RUNTIME_EVIDENCE_RETENTION_MS: ${DEBUG_AI_RUNTIME_EVIDENCE_RETENTION_MS:-43200000}
      DEBUG_AI_RUNTIME_EVIDENCE_MAX_BYTES: ${DEBUG_AI_RUNTIME_EVIDENCE_MAX_BYTES:-33554432}
      DEBUG_AI_RUNTIME_EVIDENCE_ROTATE_MS: ${DEBUG_AI_RUNTIME_EVIDENCE_ROTATE_MS:-900000}
      DEBUG_AI_ARCHIVE_SWEEP_MS: ${DEBUG_AI_ARCHIVE_SWEEP_MS:-1800000}
      DEBUG_AI_ARCHIVE_INITIAL_DELAY_MS: ${DEBUG_AI_ARCHIVE_INITIAL_DELAY_MS:-60000}
      DEBUG_AI_ARCHIVE_MAX_RUNS: ${DEBUG_AI_ARCHIVE_MAX_RUNS:-4}
      DEBUG_AI_WORKSPACE_ROOT: /workspace
      DEBUG_AI_SANDBOX_JOB_ROOT: /sandbox-jobs
      DEBUG_AI_TS_LSP_COMMAND: /app/node_modules/.bin/tsc
      DEBUG_AI_HOST: 127.0.0.1
      DEBUG_AI_PORT: 8787
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEBUG_AI_GROQ_URL: ${DEBUG_AI_GROQ_URL:-}
      DEBUG_AI_GEMINI_URL: ${DEBUG_AI_GEMINI_URL:-}
    volumes:
      - debug_ai_runtime:/app/runtime
      - debug_ai_sandbox_jobs:/sandbox-jobs:rw
      - ${DEBUG_AI_WORKSPACE_HOST_PATH:?required}:/workspace:rw
      - ${DEBUG_AI_OSV_DB_HOST_PATH:?required}:/opt/osv-db:ro
      - ${DEBUG_AI_TOOLS_HOST_PATH:?required}:/opt/debugai-tools:ro
      - ${DEBUG_AI_EVIDENCE_SEARCH_SECRET_HOST_PATH:?required}:/run/secrets/astera_internal_service_secret:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"

  sandbox-runner:
    depends_on:
      sandbox-init:
        condition: service_completed_successfully
    build:
      context: .
      target: sandbox-runner
    restart: unless-stopped
    network_mode: none
    read_only: true
    environment:
      DEBUG_AI_SANDBOX_JOB_ROOT: /sandbox-jobs
      DEBUG_AI_SANDBOX_COMMAND: /usr/local/bin/debugai-sandbox-exec
      DEBUG_AI_SANDBOX_POLL_MS: 250
    volumes:
      - debug_ai_sandbox_jobs:/sandbox-jobs:rw
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: local
      options:
        max-size: "2m"
        max-file: "2"

volumes:
  debug_ai_runtime:
  debug_ai_sandbox_jobs:
