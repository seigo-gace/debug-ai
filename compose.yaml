services:
  debug-ai:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      DEBUG_AI_CORE_URL: ${DEBUG_AI_CORE_URL:?required}
      AI_CORE_API_KEY: ${AI_CORE_API_KEY:?required}
      DEBUG_AI_EVIDENCE_SEARCH_URL: ${DEBUG_AI_EVIDENCE_SEARCH_URL:?required}
      DEBUG_AI_TGSERVER_URL: ${DEBUG_AI_TGSERVER_URL:?required}
      DEBUG_AI_TGSERVER_LOG_PROJECT_ID: ${DEBUG_AI_TGSERVER_LOG_PROJECT_ID:?required}
      DEBUG_AI_TGSERVER_KB_PROJECT_ID: ${DEBUG_AI_TGSERVER_KB_PROJECT_ID:?required}
      DEBUG_AI_REPO_ALLOWLIST: ${DEBUG_AI_REPO_ALLOWLIST:?required}
      DEBUG_AI_OSV_DB: /opt/osv-db
      DEBUG_AI_OSV_SCANNER: /opt/debugai-tools/osv-scanner
      DEBUG_AI_RUNTIME_ROOT: /app/runtime
      DEBUG_AI_WORKSPACE_ROOT: /workspace
      DEBUG_AI_TS_LSP_COMMAND: /app/node_modules/.bin/tsc
      DEBUG_AI_HOST: 127.0.0.1
      DEBUG_AI_PORT: 8787
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEBUG_AI_GROQ_URL: ${DEBUG_AI_GROQ_URL:-}
      DEBUG_AI_GEMINI_URL: ${DEBUG_AI_GEMINI_URL:-}
    volumes:
      - debug_ai_runtime:/app/runtime
      - ${DEBUG_AI_WORKSPACE_HOST_PATH:?required}:/workspace:rw
      - ${DEBUG_AI_OSV_DB_HOST_PATH:?required}:/opt/osv-db:ro
      - ${DEBUG_AI_TOOLS_HOST_PATH:?required}:/opt/debugai-tools:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  debug_ai_runtime:
