<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Chat</title><link rel="stylesheet" href="/chat/ui.css"><script src="/chat/ui.js" defer></script></head><body><aside><h1>AI Chat</h1><button id="login">接続</button><button id="new">＋ 新しいチャット</button><input id="search" placeholder="履歴を検索" aria-label="履歴検索"><nav id="history"></nav></aside><main class="native-composer-workspace"><header><strong>Qwen3.5</strong><span id="connection">未接続</span></header><section class="native-timeline" id="timeline"><div class="native-timeline-inner" id="messages"></div></section><div class="native-composer-dock"><div class="native-notice" id="notice" role="status">通常会話・ローカルQwenのみ。開発実行やDeepSeek外部送信は未接続。</div><form class="native-composer" id="form"><textarea id="prompt" placeholder="メッセージを入力..." aria-label="メッセージ"></textarea><div class="native-composer-actions"><div class="native-left-tools"><label for="attachment" class="native-text-button">＋ テキスト添付</label><input id="attachment" type="file" accept=".txt,.md,.json,.js,.ts,.py,.log,.csv" hidden><label>回答上限 <select id="budget"><option>256</option><option>512</option><option>1024</option></select></label></div><div class="native-right-tools"><button id="stop" type="button" disabled>停止</button><button class="native-run-button" id="send" aria-label="送信">↑</button></div></div></form></div></main></body></html>
