name: ChatGPT TGserver Log Read

on:
  push:
    branches:
      - automation/chatgpt-verify
    paths:
      - .github/chatgpt-tgserver-query.json
      - .github/workflows/chatgpt-tgserver-log-read.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-tgserver-log-read
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.config.outputs.configured }}
      queries: ${{ steps.config.outputs.queries }}
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4

      - name: Validate project query set
        id: config
        shell: bash
        env:
          TGSERVER_BASE_URL: ${{ vars.DEBUG_AI_TGSERVER_URL }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const cfg=JSON.parse(fs.readFileSync('.github/chatgpt-tgserver-query.json','utf8'));
          if(!Array.isArray(cfg.queries)||cfg.queries.length<1||cfg.queries.length>20) throw new Error('INVALID_QUERY_SET');
          for(const [i,q] of cfg.queries.entries()){
            if(!/^P\d+$/.test(String(q.project_id||''))) throw new Error(`INVALID_PROJECT_ID_${i}`);
            if(typeof q.query!=='string'||q.query.length>256) throw new Error(`INVALID_QUERY_${i}`);
            const limit=Number(q.limit??50);
            if(!Number.isInteger(limit)||limit<1||limit>100) throw new Error(`INVALID_LIMIT_${i}`);
          }
          fs.writeFileSync('tgserver-queries.compact.json',JSON.stringify(cfg.queries));
          NODE
          {
            echo 'queries<<EOF'
            cat tgserver-queries.compact.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ -n "${TGSERVER_BASE_URL:-}" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'TGSERVER_PUBLIC_URL_CONFIGURED=TRUE'
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'TGSERVER_PUBLIC_URL_CONFIGURED=FALSE'
          fi
          echo 'TGSERVER_SHARED_READER=seigo-gace/TGserver/.github/workflows/tgserver-read-evidence-reusable.yml'
          echo 'TGSERVER_MODE=READ_ONLY'

  read-tgserver-evidence:
    needs: prepare
    if: needs.prepare.outputs.configured == 'true'
    uses: seigo-gace/TGserver/.github/workflows/tgserver-read-evidence-reusable.yml@feat/tgserver-vnext-capability-20261002
    with:
      base_url: ${{ vars.DEBUG_AI_TGSERVER_URL }}
      queries_json: ${{ needs.prepare.outputs.queries }}
      artifact_prefix: debugai-tgserver-evidence
    secrets:
      cf_access_client_id: ${{ secrets.DEBUGAI_CF_ACCESS_CLIENT_ID }}
      cf_access_client_secret: ${{ secrets.DEBUGAI_CF_ACCESS_CLIENT_SECRET }}
      tgserver_bearer_token: ${{ secrets.TGSERVER_API_TOKEN }}

  boundary-summary:
    needs: [prepare, read-tgserver-evidence]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Safety boundary
        shell: bash
        run: |
          echo "TGSERVER_REUSABLE_READER=ENABLED"
          echo "TGSERVER_CONFIGURED=${{ needs.prepare.outputs.configured }}"
          echo "TGSERVER_PROJECTS=P004,P005"
          echo "TGSERVER_LANE=READ_ONLY"
          echo "TGSERVER_INGEST_CALLED=FALSE"
          echo "TGSERVER_BULK_INGEST_CALLED=FALSE"
          echo "SOURCE_MUTATION=NONE"
          echo "SECRET_VALUE_OUTPUT=NONE"
