name: ChatGPT Self Hosted Runner Probe

on:
  push:
    branches:
      - feat/tgserver-async-log-sink-20261003
    paths:
      - .github/self-hosted-runner-probe.json

permissions:
  contents: read

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Read-only runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "SELF_HOSTED_RUNNER=AVAILABLE"
          echo "RUNNER_OS=$RUNNER_OS"
          pwd
