name: Canonical Bootstrap Reconstruct
on:
  push:
    branches: [migration/server-canonical-20260925]
    paths: [bootstrap/READY]
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/server-canonical-20260925
      - name: Verify and reconstruct exact canonical tree
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/payload/part-* > /tmp/debugai-canonical.b64
          echo '4d1b6de8a99ca18d7d3bf9c87a1a90cd1e6676db76fd2e94d5695c7a412420a4  /tmp/debugai-canonical.b64' | sha256sum -c -
          base64 -d /tmp/debugai-canonical.b64 > /tmp/debugai-canonical.tar.gz
          echo 'd99d3b90e90298a5c78113800f8f37ed3a010cd62dfcd3d8032a2c4d0755a2b1  /tmp/debugai-canonical.tar.gz' | sha256sum -c -
          tar -xzf /tmp/debugai-canonical.tar.gz -C .
          rm -rf bootstrap .github/workflows/bootstrap-reconstruct.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: import canonical DebugAI codebase'
          git push origin HEAD:migration/server-canonical-20260925
