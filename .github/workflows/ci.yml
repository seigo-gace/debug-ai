name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-24.20.0-npm-${{ hashFiles('package.json') }}
          restore-keys: ${{ runner.os }}-node-24.20.0-npm-
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: DEBUG_AI_REQUIRE_TS7_REAL=1 npm run verify
  legacy-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - run: npm run test:legacy
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
