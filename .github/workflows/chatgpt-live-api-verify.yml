name: DebugAI Product Runtime Reflection

on:
  push:
    branches:
      - feat/chat-gitops-request-20261009
      - fix/codex-debugai-live-20261011
    paths:
      - .github/chatgpt-live-api-target.json
      - .github/workflows/chatgpt-live-api-verify.yml

permissions:
  contents: read

concurrency:
  group: chatgpt-live-dogfood
  cancel-in-progress: false

jobs:
  live-dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.DEBUGAI_CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.DEBUGAI_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate DebugAI-only reflection target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          file=.github/chatgpt-live-api-target.json
          jq -e 'type=="object" and ((keys|sort)==(["base_url","mode","repo","request","gitops_request"]|sort)) and .base_url=="https://debugai.asterav8.jp" and .mode=="readonly" and .repo=="/workspace/debug-ai" and (.request|type=="string" and length<=2000) and (.gitops_request|type=="object") and (.gitops_request.enabled|type=="boolean")' "$file" >/dev/null
          enabled="$(jq -r '.gitops_request.enabled' "$file")"
          if [[ "$enabled" == "false" ]]; then
            jq -e '.gitops_request|keys==["enabled"]' "$file" >/dev/null
          fi
          echo "gitops_enabled=$enabled" >> "$GITHUB_OUTPUT"
      - name: Admitted GitOps deployment via existing DebugAI API
        if: ${{ steps.target.outputs.gitops_enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "feat/chat-gitops-request-20261009" || "$GITHUB_REF_NAME" == "fix/codex-debugai-live-20261011" ]] || { echo "CHAT_GITOPS_TRIGGER_BRANCH_DENIED"; exit 31; }
          file=".github/chatgpt-live-api-target.json"
          jq -e '.gitops_request | type=="object" and (.enabled==true) and ((keys|sort)==(["branch","enabled","sha"]|sort))' "$file" >/dev/null
          branch="$(jq -r '.gitops_request.branch' "$file")"
          sha="$(jq -r '.gitops_request.sha' "$file")"
          [[ ( "$GITHUB_REF_NAME" == "feat/chat-gitops-request-20261009" && "$branch" == "feat/tgserver-async-log-sink-20261003" ) || ( "$GITHUB_REF_NAME" == "fix/codex-debugai-live-20261011" && "$branch" == "fix/scout-observation-reuse-20261010" ) ]] || { echo "CHAT_GITOPS_DEPLOY_BRANCH_DENIED"; exit 32; }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "CHAT_GITOPS_SHA_INVALID"; exit 33; }
          remote="$(git ls-remote origin "refs/heads/$branch" | awk 'NR==1{print $1}')"
          [[ "$remote" == "$sha" ]] || { echo "CHAT_GITOPS_REMOTE_SHA_MISMATCH"; exit 34; }
          [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]
          jq -nc --arg branch "$branch" --arg sha "$sha" '
            {action:"deploy",repo:"/workspace/debug-ai",branch:$branch,sha:$sha,
             expected_head:$sha,human_approved:true,
             delegation:(if $branch=="fix/scout-observation-reuse-20261010" then {id:"dlg_master_debugai_v1",mode:"MASTER_INTERNAL_PERSISTENT",repository:"seigo-gace/debug-ai",scope:"debugai.compose.reflect",runtime_target:"debugai.compose"} else {id:"dlg_debugai_reflect_v1",scope:"debugai.compose.reflect"} end)}
          ' >/tmp/chat-gitops-body.json
          http="$(curl -sS --max-time 35 -o /tmp/chat-gitops-response.json -w '%{http_code}' -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H "content-type: application/json" --data-binary @/tmp/chat-gitops-body.json "https://debugai.asterav8.jp/v1/gitops/request")"
          echo "CHAT_GITOPS_REQUEST_HTTP=$http"
          [[ "$http" == "202" ]] || { echo "CHAT_GITOPS_REQUEST_REJECTED"; exit 35; }
          touch /tmp/chat-gitops-request-sent
          id="$(jq -r '.id // empty' /tmp/chat-gitops-response.json)"
          [[ "$id" =~ ^gitops_[0-9a-f]{24}$ ]] || { echo "CHAT_GITOPS_ID_INVALID"; exit 36; }
          echo "CHAT_GITOPS_REQUEST_ID=$id"
          deadline=$((SECONDS+1500))
          while ((SECONDS < deadline)); do
            body="$(jq -nc --arg id "$id" '{repo:"/workspace/debug-ai",id:$id}')"
            http="$(curl -sS --max-time 35 -o /tmp/chat-gitops-status.json -w '%{http_code}' -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H "content-type: application/json" --data-binary "$body" "https://debugai.asterav8.jp/v1/gitops/status")"
            [[ "$http" == "200" ]] || { sleep 10; continue; }
            [[ "$(jq -r '.id // empty' /tmp/chat-gitops-status.json)" == "$id" ]] || exit 37
            state="$(jq -r '.state // "UNKNOWN"' /tmp/chat-gitops-status.json)"
            if [[ "$state" == "PASS" ]]; then
              deployed="$(jq -r '.result.deployed_sha // empty' /tmp/chat-gitops-status.json)"
              [[ "$deployed" == "$sha" ]] || { echo "CHAT_GITOPS_DEPLOYED_SHA_MISMATCH"; exit 38; }
              echo "CHAT_GITOPS_TERMINAL=PASS"
              echo "CHAT_GITOPS_DEPLOYED_SHA=$deployed"
              break
            fi
            if [[ "$state" == "FAIL" ]]; then
              cause="$(jq -r '.error // "UNKNOWN"' /tmp/chat-gitops-status.json)"
              [[ "$cause" =~ ^[A-Z][A-Z0-9_]{0,79}$ ]] || cause="REDACTED_OR_UNKNOWN"
              echo "CHAT_GITOPS_TERMINAL=FAIL"
              echo "CHAT_GITOPS_FAILURE_CLASS=$cause"
              exit 39
            fi
            [[ "$state" == "RUNNING" || "$state" == "QUEUED" ]] || exit 40
            sleep 10
          done
          [[ "${state:-}" == "PASS" ]] || { echo "CHAT_GITOPS_TERMINAL=TIMEOUT"; exit 41; }
          code="$(curl -sS --max-time 30 -o /tmp/chat-post-health.json -w '%{http_code}' -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" "https://debugai.asterav8.jp/health")"
          [[ "$code" == "200" ]] || { echo "CHAT_GITOPS_POST_HEALTH_HTTP=$code"; exit 42; }
          jq -e '.ok==true and .service=="debug-ai"' /tmp/chat-post-health.json >/dev/null
          echo "CHAT_GITOPS_POST_HEALTH=PASS"
          echo "CHAT_GITOPS_POST_HEAD_READBACK_BEGIN"
          jq -nc '{repo:"/workspace/debug-ai",command_id:"project.git_head",arguments:[]}' >/tmp/debugai-head-request.json
          code="$(curl -sS --max-time 35 -o /tmp/debugai-head-response.json -w '%{http_code}' -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H "content-type: application/json" --data-binary @/tmp/debugai-head-request.json "https://debugai.asterav8.jp/v1/server-command/request")"
          [[ "$code" == "202" ]] || exit 43
          head_id="$(jq -r '.id' /tmp/debugai-head-response.json)"
          [[ "$head_id" =~ ^cmd_[0-9a-f]{24}$ ]] || exit 43
          jq -nc --arg id "$head_id" '{repo:"/workspace/debug-ai",id:$id}' >/tmp/debugai-head-status-request.json
          head_verified=false
          for attempt in {1..60}; do
            code="$(curl -sS --max-time 35 -o /tmp/debugai-head-status.json -w '%{http_code}' -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H "content-type: application/json" --data-binary @/tmp/debugai-head-status-request.json "https://debugai.asterav8.jp/v1/server-command/status")"
            [[ "$code" == "200" ]] || exit 43
            jq -e --arg id "$head_id" '.id==$id' /tmp/debugai-head-status.json >/dev/null || exit 43
            head_state="$(jq -r '.state' /tmp/debugai-head-status.json)"
            if [[ "$head_state" == "PASS" ]]; then
              jq -e --arg sha "$sha" '.result.read_only==true and .result.command_id=="project.git_head" and .result.exit_code==0 and (.result.stdout|rtrimstr("\n"))==$sha' /tmp/debugai-head-status.json >/dev/null || exit 43
              head_verified=true
              break
            fi
            [[ "$head_state" == "QUEUED" || "$head_state" == "RUNNING" ]] || exit 43
            sleep 2
          done
          [[ "$head_verified" == "true" ]] || exit 43
          echo "CHAT_GITOPS_POST_HOST_SHA_MATCH=TRUE"
