name: ChatGPT Source Verify

on:
  push:
    branches:
      - automation/chatgpt-verify
    paths:
      - .github/chatgpt-verify-target
      - .github/workflows/chatgpt-source-verify.yml

permissions:
  contents: read

concurrency:
  group: chatgpt-source-verify
  cancel-in-progress: true

jobs:
  verify-target:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout verifier branch
        uses: actions/checkout@v4

      - name: Read exact target SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '[:space:]' < .github/chatgpt-verify-target)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid target SHA" >&2
            exit 2
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "TARGET_SHA=$sha"

      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1

      - name: Confirm exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ steps.target.outputs.sha }}"
          echo "EXPECTED_SHA=$expected"
          echo "ACTUAL_SHA=$actual"
          test "$actual" = "$expected"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Full source verify
        shell: bash
        run: |
          set -o pipefail
          DEBUG_AI_REQUIRE_TS7_REAL=1 npm run verify 2>&1 | tee source-verify.log

      - name: E2E fixture
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e-fixture 2>&1 | tee e2e-fixture.log

      - name: Legacy authority regression
        shell: bash
        run: |
          set -o pipefail
          npm run test:legacy 2>&1 | tee legacy.log

      - name: Compose contract
        shell: bash
        env:
          DEBUG_AI_CORE_URL: http://127.0.0.1:1
          AI_CORE_API_KEY: ci-placeholder
          DEBUG_AI_CORE_CONTEXT_TOKENS: '8192'
          DEBUG_AI_EVIDENCE_SEARCH_URL: http://127.0.0.1:2
          DEBUG_AI_TGSERVER_URL: http://127.0.0.1:3
          DEBUG_AI_TGSERVER_LOG_PROJECT_ID: ci-log
          DEBUG_AI_TGSERVER_KB_PROJECT_ID: ci-kb
          DEBUG_AI_REPO_ALLOWLIST: /workspace
          DEBUG_AI_WORKSPACE_HOST_PATH: /tmp/debugai-workspace
          DEBUG_AI_OSV_DB_HOST_PATH: /tmp/debugai-osv
          DEBUG_AI_TOOLS_HOST_PATH: /tmp/debugai-tools
          DEBUG_AI_EVIDENCE_SEARCH_SECRET_HOST_PATH: /tmp/debugai-secret
        run: |
          set -o pipefail
          docker compose config -q 2>&1 | tee compose-config.log

      - name: Build runtime images
        shell: bash
        run: |
          set -o pipefail
          docker build --target debug-ai -t debug-ai-chatgpt-verify:${{ steps.target.outputs.sha }} . 2>&1 | tee docker-debug-ai.log
          docker build --target sandbox-runner -t debug-ai-sandbox-chatgpt-verify:${{ steps.target.outputs.sha }} . 2>&1 | tee docker-sandbox.log

      - name: Verification summary
        if: always()
        shell: bash
        run: |
          echo "TARGET_SHA=${{ steps.target.outputs.sha }}"
          echo "GITHUB_RUN_ID=${{ github.run_id }}"
          echo "SOURCE_VERIFY_JOB_STATUS=${{ job.status }}"

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-source-verify-${{ github.run_id }}
          path: |
            source-verify.log
            e2e-fixture.log
            legacy.log
            compose-config.log
            docker-debug-ai.log
            docker-sandbox.log
          if-no-files-found: ignore
          retention-days: 7
