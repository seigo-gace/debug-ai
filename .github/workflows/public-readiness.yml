name: Public Readiness Audit
on:
  push:
    branches: [migration/server-canonical-20260925, clean-public-candidate]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan current tree and all refs without printing secret values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, subprocess, sys

          ROOT=pathlib.Path('.')
          findings=[]; warnings=[]
          SECRET_PATTERNS=[
            ('PRIVATE_KEY',re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----')),
            ('GITHUB_TOKEN',re.compile(rb'\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}\b')),
            ('GITHUB_FINE_GRAINED_PAT',re.compile(rb'\bgithub_pat_[A-Za-z0-9_]{20,}\b')),
            ('GOOGLE_CLIENT_SECRET',re.compile(rb'\bGOCSPX-[A-Za-z0-9_-]{20,}\b')),
            ('AWS_ACCESS_KEY',re.compile(rb'\b(?:AKIA|ASIA)[A-Z0-9]{16}\b')),
            ('SLACK_TOKEN',re.compile(rb'\bxox[baprs]-[A-Za-z0-9-]{20,}\b')),
            ('STRIPE_LIVE_KEY',re.compile(rb'\b(?:sk_live|rk_live)_[A-Za-z0-9]{16,}\b')),
            ('TELEGRAM_BOT_TOKEN',re.compile(rb'\b\d{8,12}:[A-Za-z0-9_-]{30,}\b')),
            ('BEARER_TOKEN',re.compile(rb'Bearer\s+[A-Za-z0-9._~+/=-]{24,}')),
          ]
          ENV_NAME=re.compile(rb'(?m)^[ \t]*([A-Z0-9_]*(?:API_KEY|TOKEN|SECRET|PASSWORD|PRIVATE_KEY|CLIENT_SECRET)[A-Z0-9_]*)[ \t]*=[ \t]*([^\r\n#]*)')
          HOME_PATH=re.compile(rb'/home/admin1(?:/|\b)')

          def scan_bytes(scope,path,data):
            if not data or b'\x00' in data[:8192]: return
            for label,rx in SECRET_PATTERNS:
              if rx.search(data): findings.append((scope,path,label))
            for m in ENV_NAME.finditer(data):
              key=m.group(1).decode('ascii','replace')
              value=m.group(2).strip().strip(b'"\'')
              if key.endswith('_FILE'): continue
              if not value or value.startswith((b'${',b'$(',b'<',b'[REDACTED]')): continue
              if value.lower() in {b'test',b'dummy',b'example',b'placeholder',b'changeme'}: continue
              if len(value)>=16: findings.append((scope,path,f'NONEMPTY_SECRET_ASSIGNMENT:{key}'))
            if path!='.github/workflows/public-readiness.yml' and HOME_PATH.search(data):
              warnings.append((scope,path,'HARDCODED_HOME_PATH'))

          for p in ROOT.rglob('*'):
            if not p.is_file() or '.git' in p.parts: continue
            try: data=p.read_bytes()
            except OSError: continue
            if len(data)<=2_000_000: scan_bytes('CURRENT',p.as_posix(),data)

          rows=subprocess.check_output(['git','rev-list','--objects','--all'],text=True).splitlines(); seen=set()
          for row in rows:
            parts=row.split(' ',1); oid=parts[0]; path=parts[1] if len(parts)>1 else '<unknown>'
            if oid in seen: continue
            seen.add(oid)
            if subprocess.run(['git','cat-file','-t',oid],capture_output=True,text=True).stdout.strip()!='blob': continue
            size=subprocess.run(['git','cat-file','-s',oid],capture_output=True,text=True).stdout.strip()
            if not size.isdigit() or int(size)>2_000_000: continue
            scan_bytes(f'HISTORY:{oid[:12]}',path,subprocess.check_output(['git','cat-file','blob',oid]))

          findings=sorted(set(findings)); warnings=sorted(set(warnings))
          for scope,path,label in warnings: print(f'PUBLIC_WARNING scope={scope} path={path} kind={label}')
          for scope,path,label in findings: print(f'PUBLIC_BLOCK scope={scope} path={path} kind={label}')
          print(f'PUBLIC_SECRET_FINDINGS={len(findings)}'); print(f'PUBLIC_METADATA_WARNINGS={len(warnings)}')
          if findings:
            print('PUBLIC_READINESS=BLOCKED'); sys.exit(1)
          print('PUBLIC_READINESS=SECRET_SCAN_PASS')
          PY
