name: ChatGPT Investigation Benchmark Status

on:
  push:
    branches:
      - automation/chatgpt-verify
    paths:
      - .github/workflows/chatgpt-exact-head-reflection.yml

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://debugai.asterav8.jp
      BENCHMARK_ID: invbench_3cf4b8ce792948969346636c3a548ee0
      CF_ACCESS_CLIENT_ID: ${{ secrets.DEBUGAI_CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.DEBUGAI_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Read benchmark status
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 30 -o /tmp/status.json -w '%{http_code}'             -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"             -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"             "$BASE_URL/v1/investigation-benchmark/status/$BENCHMARK_ID")"
          echo "STATUS_HTTP=$code"
          cat /tmp/status.json
          test "$code" = "200"
