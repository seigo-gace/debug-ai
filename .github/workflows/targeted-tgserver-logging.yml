name: Targeted TGserver Logging

on:
  push:
    branches:
      - feat/tgserver-async-log-sink-20261003
  pull_request:
    paths:
      - "server/adapters/tgserver.js"
      - "server/main.js"
      - "server/tests/tgserver-async-log-sink.test.cjs"
      - "server/tests/tgserver-ci-report.test.cjs"
      - "server/tests/server.test.cjs"
      - "scripts/tgserver-ci-report.cjs"
      - ".env.example"
      - ".github/workflows/targeted-tgserver-logging.yml"

permissions:
  contents: read

jobs:
  tgserver-log-sink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: TGserver log-sink contract
        run: node --test server/tests/tgserver-async-log-sink.test.cjs server/tests/tgserver-ci-report.test.cjs server/tests/server.test.cjs
      - name: Syntax guard
        run: node --check server/adapters/tgserver.js && node --check server/main.js && node --check scripts/tgserver-ci-report.cjs
      - name: Publish CI evidence to legacy TGserver P004
        if: always()
        continue-on-error: true
        env:
          LEGACY_TGSERVER_URL: https://tgserver.asterav8.jp
          TGS_CF_ACCESS_CLIENT_ID: ${{ secrets.LEGACY_TGSERVER_CF_ACCESS_CLIENT_ID }}
          TGS_CF_ACCESS_CLIENT_SECRET: ${{ secrets.LEGACY_TGSERVER_CF_ACCESS_CLIENT_SECRET }}
          TGS_PROJECT_ID: P004
          TGS_JOB_STATUS: ${{ job.status }}
          TGS_WORKFLOW: ${{ github.workflow }}
          TGS_JOB: tgserver-log-sink
        run: node scripts/tgserver-ci-report.cjs
