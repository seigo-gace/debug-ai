name: Core Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax and source gate
        run: npm run check
      - name: Core contract tests
        run: node --test tests/core-server.test.cjs
      - name: Server behavior tests
        run: node --test server/tests/server.test.cjs
      - name: TypeScript 7 real gate
        run: DEBUG_AI_REQUIRE_TS7_REAL=1 node --test server/tests/typescript7-real.test.cjs
