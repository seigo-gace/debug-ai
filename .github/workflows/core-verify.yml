name: Core Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax and source gate
        run: npm run check
      - name: Role routing contract
        run: node --test --test-name-pattern='latest six-role authority' tests/core-server.test.cjs
      - name: AI Core request contract
        run: node --test --test-name-pattern='AI Core adapter sends' tests/core-server.test.cjs
      - name: State machine contract
        run: node --test --test-name-pattern='canonical state machine' tests/core-server.test.cjs
      - name: Store idempotency contract
        run: node --test --test-name-pattern='store same request replay' tests/core-server.test.cjs
      - name: Governance surface contract
        run: node --test --test-name-pattern='debug governance module' tests/core-server.test.cjs
      - name: Repo policy contract
        run: node --test --test-name-pattern='repo policy blocks' tests/core-server.test.cjs
      - name: Run authority contract
        run: node --test --test-name-pattern='run authority persists' tests/core-server.test.cjs
      - name: Server behavior tests
        run: node --test server/tests/server.test.cjs
      - name: TypeScript 7 real gate
        run: DEBUG_AI_REQUIRE_TS7_REAL=1 node --test server/tests/typescript7-real.test.cjs
      - name: Debug AI image build
        run: docker build --target debug-ai -t debug-ai-app-ci .
      - name: Sandbox sidecar image build
        run: docker build --target sandbox-runner -t debug-ai-sandbox-ci .
      - name: Landlock seccomp sidecar real isolation gate
        run: >-
          docker run --rm
          --network none
          --read-only
          --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777
          --tmpfs /sandbox-jobs:rw,nosuid,nodev,size=64m,mode=1777
          --security-opt no-new-privileges:true
          --cap-drop ALL
          --pids-limit 128
          --memory 512m
          --cpus 1
          debug-ai-sandbox-ci
          node server/control/sandbox-selftest.js
      - name: Sandbox main-to-sidecar queue round-trip gate
        shell: bash
        run: |
          set -euo pipefail
          name=debug-ai-sandbox-queue-ci
          volume=debug_ai_sandbox_queue_ci
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          cleanup
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run -d --name "$name" \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --pids-limit 128 \
            --memory 512m \
            --cpus 1 \
            -v "$volume:/sandbox-jobs" \
            debug-ai-sandbox-ci >/dev/null
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            -v "$volume:/sandbox-jobs" \
            debug-ai-app-ci \
            node server/control/sandbox-queue-selftest.js enqueue
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            -v "$volume:/sandbox-jobs" \
            debug-ai-app-ci \
            node server/control/sandbox-queue-selftest.js verify
          docker logs "$name"
      - name: Compose sandbox boundary render gate
        env:
          DEBUG_AI_CORE_URL: http://127.0.0.1:18080
          AI_CORE_API_KEY: ci-test-key
          DEBUG_AI_EVIDENCE_SEARCH_URL: http://127.0.0.1:7376
          DEBUG_AI_EVIDENCE_SEARCH_SECRET_HOST_PATH: /tmp/ci-evidence-secret
          DEBUG_AI_TGSERVER_URL: http://127.0.0.1:3000
          DEBUG_AI_TGSERVER_LOG_PROJECT_ID: P004
          DEBUG_AI_TGSERVER_KB_PROJECT_ID: P005
          DEBUG_AI_REPO_ALLOWLIST: repo-a
          DEBUG_AI_WORKSPACE_HOST_PATH: /tmp/ci-workspace
          DEBUG_AI_OSV_DB_HOST_PATH: /tmp/ci-osv-db
          DEBUG_AI_TOOLS_HOST_PATH: /tmp/ci-tools
        run: docker compose config --quiet
