name: Core Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax and source gate
        run: npm run check
      - name: Role routing contract
        run: node --test --test-name-pattern='latest six-role authority' tests/core-server.test.cjs
      - name: AI Core request contract
        run: node --test --test-name-pattern='AI Core adapter sends' tests/core-server.test.cjs
      - name: State machine contract
        run: node --test --test-name-pattern='canonical state machine' tests/core-server.test.cjs
      - name: Store idempotency contract
        run: node --test --test-name-pattern='store same request replay' tests/core-server.test.cjs
      - name: Governance surface contract
        run: node --test --test-name-pattern='debug governance module' tests/core-server.test.cjs
      - name: Repo policy contract
        run: node --test --test-name-pattern='repo policy blocks' tests/core-server.test.cjs
      - name: Run authority contract
        run: node --test --test-name-pattern='run authority persists' tests/core-server.test.cjs
      - name: Server behavior tests
        run: node --test server/tests/server.test.cjs
      - name: TypeScript 7 real gate
        run: DEBUG_AI_REQUIRE_TS7_REAL=1 node --test server/tests/typescript7-real.test.cjs
      - name: Debug AI image build
        run: docker build --target debug-ai -t debug-ai-app-ci .
      - name: Sandbox sidecar image build
        run: docker build --target sandbox-runner -t debug-ai-sandbox-ci .
      - name: Landlock seccomp sidecar real isolation gate
        run: >-
          docker run --rm
          --network none
          --read-only
          --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777
          --tmpfs /sandbox-jobs:rw,nosuid,nodev,size=64m,mode=1777
          --security-opt no-new-privileges:true
          --cap-drop ALL
          --pids-limit 128
          --memory 512m
          --cpus 1
          debug-ai-sandbox-ci
          node server/control/sandbox-selftest.js
      - name: DAP loopback-only sandbox gate
        run: >-
          docker run --rm
          --network none
          --read-only
          --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777
          --tmpfs /sandbox-jobs:rw,nosuid,nodev,size=64m,mode=1777
          --security-opt no-new-privileges:true
          --cap-drop ALL
          --pids-limit 128
          --memory 512m
          --cpus 1
          debug-ai-sandbox-ci
          node server/control/sandbox-loopback-selftest.js
      - name: Managed DAP queue setup
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f debug-ai-dap-queue-ci >/dev/null 2>&1 || true
          docker volume rm debug_ai_dap_queue_ci >/dev/null 2>&1 || true
          docker volume create debug_ai_dap_queue_ci >/dev/null
          docker run -d --name debug-ai-dap-queue-ci \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --pids-limit 192 \
            --memory 768m \
            --cpus 1 \
            -v debug_ai_dap_queue_ci:/sandbox-jobs \
            debug-ai-sandbox-ci >/dev/null
      - name: Managed Node DAP real queue gate
        id: dap_node
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js enqueue node
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js verify node
      - name: Node DAP diagnostic SANDBOX_EXEC_OR_EVIDENCE_PARSE
        if: always() && steps.dap_node.outcome == 'failure'
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js diagnose node SANDBOX_EXEC_OR_EVIDENCE_PARSE
      - name: Node DAP diagnostic PRECHECK
        if: always() && steps.dap_node.outcome == 'failure'
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js diagnose node PRECHECK
      - name: Node DAP diagnostic CONFIGURATION
        if: always() && steps.dap_node.outcome == 'failure'
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js diagnose node CONFIGURATION
      - name: Node DAP diagnostic CONNECT_MCP
        if: always() && steps.dap_node.outcome == 'failure'
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js diagnose node CONNECT_MCP
      - name: Node DAP diagnostic TOOL_DISCOVERY
        if: always() && steps.dap_node.outcome == 'failure'
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js diagnose node TOOL_DISCOVERY
      - name: Node DAP diagnostic ADD_BREAKPOINT
        if: always() && steps.dap_node.outcome == 'failure'
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js diagnose node ADD_BREAKPOINT
      - name: Node DAP diagnostic START_DEBUGGING
        if: always() && steps.dap_node.outcome == 'failure'
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js diagnose node START_DEBUGGING
      - name: Node DAP diagnostic OBSERVE_STATUS
        if: always() && steps.dap_node.outcome == 'failure'
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js diagnose node OBSERVE_STATUS
      - name: Node DAP diagnostic LIST_VARIABLE_NAMES
        if: always() && steps.dap_node.outcome == 'failure'
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js diagnose node LIST_VARIABLE_NAMES
      - name: Node DAP diagnostic GET_VARIABLE_VALUES
        if: always() && steps.dap_node.outcome == 'failure'
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js diagnose node GET_VARIABLE_VALUES
      - name: Node DAP diagnostic COMPLETE
        if: always() && steps.dap_node.outcome == 'failure'
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js diagnose node COMPLETE
      - name: Node DAP diagnostic UNKNOWN_RUNTIME_FAILURE
        if: always() && steps.dap_node.outcome == 'failure'
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js diagnose node UNKNOWN_RUNTIME_FAILURE
      - name: Node DAP diagnostic EVIDENCE_BOUNDARY
        if: always() && steps.dap_node.outcome == 'failure'
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js diagnose node EVIDENCE_BOUNDARY
      - name: Node DAP diagnostic SECRET_BOUNDARY
        if: always() && steps.dap_node.outcome == 'failure'
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js diagnose node SECRET_BOUNDARY
      - name: Node DAP diagnostic VARIABLE_REQUEST
        if: always() && steps.dap_node.outcome == 'failure'
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js diagnose node VARIABLE_REQUEST
      - name: Node DAP diagnostic REQUIRED_TOOLS
        if: always() && steps.dap_node.outcome == 'failure'
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js diagnose node REQUIRED_TOOLS
      - name: Node DAP diagnostic VARIABLE_NAMES_TOOL
        if: always() && steps.dap_node.outcome == 'failure'
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js diagnose node VARIABLE_NAMES_TOOL
      - name: Managed Python DAP real queue gate
        id: dap_python
        if: steps.dap_node.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js enqueue python
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js verify python
      - name: DAP queue diagnostic logs
        if: always() && (steps.dap_node.outcome == 'failure' || steps.dap_python.outcome == 'failure')
        run: docker logs debug-ai-dap-queue-ci
      - name: DAP queue cleanup
        if: always()
        run: |
          docker rm -f debug-ai-dap-queue-ci >/dev/null 2>&1 || true
          docker volume rm debug_ai_dap_queue_ci >/dev/null 2>&1 || true
      - name: Managed DAP gate enforcement
        if: always() && (steps.dap_node.outcome == 'failure' || steps.dap_python.outcome == 'failure')
        run: exit 1
      - name: Sandbox main-to-sidecar queue round-trip gate
        shell: bash
        run: |
          set -euo pipefail
          name=debug-ai-sandbox-queue-ci
          volume=debug_ai_sandbox_queue_ci
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          cleanup
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run -d --name "$name" \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --pids-limit 128 \
            --memory 512m \
            --cpus 1 \
            -v "$volume:/sandbox-jobs" \
            debug-ai-sandbox-ci >/dev/null
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v "$volume:/sandbox-jobs" debug-ai-app-ci node server/control/sandbox-queue-selftest.js enqueue
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v "$volume:/sandbox-jobs" debug-ai-app-ci node server/control/sandbox-queue-selftest.js verify
          docker logs "$name"
      - name: Compose sandbox boundary render gate
        env:
          DEBUG_AI_CORE_URL: http://127.0.0.1:18080
          AI_CORE_API_KEY: ci-test-key
          DEBUG_AI_EVIDENCE_SEARCH_URL: http://127.0.0.1:7376
          DEBUG_AI_EVIDENCE_SEARCH_SECRET_HOST_PATH: /tmp/ci-evidence-secret
          DEBUG_AI_TGSERVER_URL: http://127.0.0.1:3000
          DEBUG_AI_TGSERVER_LOG_PROJECT_ID: P004
          DEBUG_AI_TGSERVER_KB_PROJECT_ID: P005
          DEBUG_AI_REPO_ALLOWLIST: repo-a
          DEBUG_AI_WORKSPACE_HOST_PATH: /tmp/ci-workspace
          DEBUG_AI_OSV_DB_HOST_PATH: /tmp/ci-osv-db
          DEBUG_AI_TOOLS_HOST_PATH: /tmp/ci-tools
        run: docker compose config --quiet
