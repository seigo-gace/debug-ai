name: Core Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax and source gate
        run: npm run check
      - name: Role routing contract
        run: node --test --test-name-pattern='latest six-role authority' tests/core-server.test.cjs
      - name: AI Core request contract
        run: node --test --test-name-pattern='AI Core adapter sends' tests/core-server.test.cjs
      - name: State machine contract
        run: node --test --test-name-pattern='canonical state machine' tests/core-server.test.cjs
      - name: Store idempotency contract
        run: node --test --test-name-pattern='store same request replay' tests/core-server.test.cjs
      - name: Governance surface contract
        run: node --test --test-name-pattern='debug governance module' tests/core-server.test.cjs
      - name: Repo policy contract
        run: node --test --test-name-pattern='repo policy blocks' tests/core-server.test.cjs
      - name: Run authority contract
        run: node --test --test-name-pattern='run authority persists' tests/core-server.test.cjs
      - name: Server behavior tests
        run: node --test server/tests/server.test.cjs
      - name: TypeScript 7 real gate
        run: DEBUG_AI_REQUIRE_TS7_REAL=1 node --test server/tests/typescript7-real.test.cjs
      - name: Debug AI image build
        run: docker build --target debug-ai -t debug-ai-app-ci .
      - name: Debug AI real-container health smoke
        shell: bash
        run: |
          set -euo pipefail
          name=debug-ai-health-ci
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          cleanup
          trap cleanup EXIT
          docker run -d --name "$name" \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            -e DEBUG_AI_RUNTIME_ROOT=/tmp/debug-ai-runtime \
            -e DEBUG_AI_CORE_URL=http://127.0.0.1:18080 \
            -e AI_CORE_API_KEY=ci-test-key \
            -e DEBUG_AI_CORE_CONTEXT_TOKENS=8192 \
            -e DEBUG_AI_EVIDENCE_SEARCH_URL=http://127.0.0.1:7376 \
            -e DEBUG_AI_EVIDENCE_SEARCH_SECRET=ci-evidence-secret-0123456789abcdef \
            -e DEBUG_AI_TGSERVER_URL=http://127.0.0.1:3000 \
            -e DEBUG_AI_TGSERVER_LOG_PROJECT_ID=P004 \
            -e DEBUG_AI_TGSERVER_KB_PROJECT_ID=P005 \
            -e DEBUG_AI_REPO_ALLOWLIST=debug-ai \
            -e GROQ_API_KEY=ci-test-key \
            debug-ai-app-ci >/dev/null
          if ! docker exec "$name" node -e '
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            (async()=>{
              for(let i=0;i<40;i++){
                try{
                  const r=await fetch("http://127.0.0.1:8787/health");
                  const j=await r.json();
                  if(r.ok&&j.ok===true&&j.service==="debug-ai"&&j.patch_apply_requires_explicit_approval===true&&j.patch_apply_approval_authority==="controlling_parent_orchestrator"&&j.patch_apply_requires_master_approval===false&&j.read_only_verify===true&&j.durable_async_runs===true&&j.startup_recovery===true){console.log("DEBUG_AI_HEALTH_SMOKE=PASS");return;}
                }catch{}
                await sleep(250);
              }
              process.exit(1);
            })();'; then
            docker logs "$name" || true
            exit 1
          fi
      - name: Sandbox sidecar image build
        run: docker build --target sandbox-runner -t debug-ai-sandbox-ci .
      - name: Landlock seccomp sidecar real isolation gate
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777
          --tmpfs /sandbox-jobs:rw,nosuid,nodev,size=64m,mode=1777
          --security-opt no-new-privileges:true --cap-drop ALL
          --pids-limit 128 --memory 512m --cpus 1
          debug-ai-sandbox-ci node server/control/sandbox-selftest.js
      - name: DAP loopback-only sandbox gate
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777
          --tmpfs /sandbox-jobs:rw,nosuid,nodev,size=64m,mode=1777
          --security-opt no-new-privileges:true --cap-drop ALL
          --pids-limit 128 --memory 512m --cpus 1
          debug-ai-sandbox-ci node server/control/sandbox-loopback-selftest.js
      - name: Managed DAP queue setup
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f debug-ai-dap-queue-ci >/dev/null 2>&1 || true
          docker volume rm debug_ai_dap_queue_ci >/dev/null 2>&1 || true
          docker volume create debug_ai_dap_queue_ci >/dev/null
          docker run -d --name debug-ai-dap-queue-ci \
            --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            --security-opt no-new-privileges:true --cap-drop ALL \
            --pids-limit 192 --memory 768m --cpus 1 \
            -v debug_ai_dap_queue_ci:/sandbox-jobs \
            debug-ai-sandbox-ci >/dev/null
      - name: Managed Node DAP real queue gate
        id: dap_node
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js enqueue node
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js verify node
      - name: Classify Node DAP failure stage
        id: dap_node_stage
        if: always() && steps.dap_node.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          stage="$(docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js stage node)"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "DAP_NODE_FAILURE_STAGE=$stage"
      - name: Node DAP permission failure SPAWN
        if: always() && steps.dap_node_stage.outputs.stage == 'CONNECT_MCP_PERMISSION_SPAWN'
        run: exit 1
      - name: Node DAP permission failure SIGNAL
        if: always() && steps.dap_node_stage.outputs.stage == 'CONNECT_MCP_PERMISSION_SIGNAL'
        run: exit 1
      - name: Node DAP permission failure FILE
        if: always() && steps.dap_node_stage.outputs.stage == 'CONNECT_MCP_PERMISSION_FILE'
        run: exit 1
      - name: Node DAP permission failure OTHER
        if: always() && steps.dap_node_stage.outputs.stage == 'CONNECT_MCP_PERMISSION_OTHER'
        run: exit 1
      - name: Node DAP permission failure UNCLASSIFIED
        if: always() && steps.dap_node_stage.outputs.stage == 'CONNECT_MCP_PERMISSION_UNCLASSIFIED'
        run: exit 1
      - name: Node DAP connect failure MODULE_LOAD
        if: always() && steps.dap_node_stage.outputs.stage == 'CONNECT_MCP_MODULE_LOAD'
        run: exit 1
      - name: Node DAP connect failure CONFIG
        if: always() && steps.dap_node_stage.outputs.stage == 'CONNECT_MCP_CONFIG'
        run: exit 1
      - name: Node DAP connect failure CLI
        if: always() && steps.dap_node_stage.outputs.stage == 'CONNECT_MCP_CLI'
        run: exit 1
      - name: Node DAP connect failure PROTOCOL_OR_CLOSED
        if: always() && steps.dap_node_stage.outputs.stage == 'CONNECT_MCP_PROTOCOL_OR_CLOSED'
        run: exit 1
      - name: Node DAP connect failure CHILD_STDERR
        if: always() && steps.dap_node_stage.outputs.stage == 'CONNECT_MCP_CHILD_STDERR'
        run: exit 1
      - name: Node DAP connect failure NO_STDERR
        if: always() && steps.dap_node_stage.outputs.stage == 'CONNECT_MCP_NO_STDERR'
        run: exit 1
      - name: Node DAP unexpected failure stage
        if: always() && steps.dap_node.outcome == 'failure' && !startsWith(steps.dap_node_stage.outputs.stage, 'CONNECT_MCP_')
        run: exit 1
      - name: Managed Python DAP real queue gate
        id: dap_python
        if: steps.dap_node.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js enqueue python
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v debug_ai_dap_queue_ci:/sandbox-jobs debug-ai-app-ci node server/control/dap-queue-selftest.js verify python
      - name: DAP queue diagnostic logs
        if: always() && (steps.dap_node.outcome == 'failure' || steps.dap_python.outcome == 'failure')
        run: docker logs debug-ai-dap-queue-ci
      - name: DAP queue cleanup
        if: always()
        run: |
          docker rm -f debug-ai-dap-queue-ci >/dev/null 2>&1 || true
          docker volume rm debug_ai_dap_queue_ci >/dev/null 2>&1 || true
      - name: Managed DAP gate enforcement
        if: always() && (steps.dap_node.outcome == 'failure' || steps.dap_python.outcome == 'failure')
        run: exit 1
      - name: Sandbox main-to-sidecar queue round-trip gate
        shell: bash
        run: |
          set -euo pipefail
          name=debug-ai-sandbox-queue-ci
          volume=debug_ai_sandbox_queue_ci
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          cleanup
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run -d --name "$name" --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --security-opt no-new-privileges:true --cap-drop ALL \
            --pids-limit 128 --memory 512m --cpus 1 \
            -v "$volume:/sandbox-jobs" debug-ai-sandbox-ci >/dev/null
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v "$volume:/sandbox-jobs" debug-ai-app-ci node server/control/sandbox-queue-selftest.js enqueue
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v "$volume:/sandbox-jobs" debug-ai-app-ci node server/control/sandbox-queue-selftest.js verify
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -e DEBUG_AI_SELFTEST_SOURCE_ROOT=/debugai-source -v "$PWD:/debugai-source:ro" -v "$volume:/sandbox-jobs" debug-ai-app-ci node server/control/sandbox-queue-selftest.js enqueue-self
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL -v "$volume:/sandbox-jobs" debug-ai-app-ci node server/control/sandbox-queue-selftest.js verify-self
          docker logs "$name"
      - name: Compose sandbox boundary render gate
        env:
          DEBUG_AI_CORE_URL: http://127.0.0.1:18080
          AI_CORE_API_KEY: ci-test-key
          DEBUG_AI_CORE_CONTEXT_TOKENS: '8192'
          DEBUG_AI_EVIDENCE_SEARCH_URL: http://127.0.0.1:7376
          DEBUG_AI_EVIDENCE_SEARCH_SECRET_HOST_PATH: /tmp/ci-evidence-secret
          DEBUG_AI_TGSERVER_URL: http://127.0.0.1:3000
          DEBUG_AI_TGSERVER_LOG_PROJECT_ID: P004
          DEBUG_AI_TGSERVER_KB_PROJECT_ID: P005
          DEBUG_AI_REPO_ALLOWLIST: repo-a
          DEBUG_AI_WORKSPACE_HOST_PATH: /tmp/ci-workspace
          DEBUG_AI_OSV_DB_HOST_PATH: /tmp/ci-osv-db
          DEBUG_AI_TOOLS_HOST_PATH: /tmp/ci-tools
        run: docker compose config --quiet
